# ===========================================
# Nginx — только HTTP (для первого запуска и получения SSL через Certbot)
# ===========================================
# Использование: скопировать как nginx.conf перед первым получением сертификата:
#   cp nginx.initial.conf nginx.conf
# После получения серта вернуть полный конфиг:
#   git checkout nginx.conf  (или восстановить из бэкапа)
# ===========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    upstream nextjs {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name sluzhba911.com www.sluzhba911.com;

        # Let's Encrypt ACME challenge (обязательно для certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Временно проксируем всё на Next.js (до появления сертификатов)
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
